<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login · SSL Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
  <main class="dashboard-shell" style="max-width: 30rem; margin: 8rem auto;">
    <section class="panel">
      <div class="panel-header">
        <h1>Admin Login</h1>
        <span>SSL Chatbot Dashboard</span>
      </div>
      {% if error %}<p role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="{{ url_for('admin_login') }}">
        <input type="hidden" name="next" value="{{ next or '' }}">
        <p><label for="username">Username</label><br><input id="username" name="username" autocomplete="username" required></p>
        <p><label for="password">Password</label><br><input id="password" name="password" type="password" autocomplete="current-password" required></p>
        <button type="submit">Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>
